apiVersion: v1
kind: Service
metadata:
  name: notifications-api
  namespace: fcg
spec:
  type: ClusterIP
  selector:
    app: notifications-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifications-api}
  template:
    metadata:
      labels: {app: notifications-api}
    spec:
      containers:
        - name: notifications-api
          image: fcg-notifications-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: fcg-notifications-api-config}
          env:
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef: {name: fcg-domain-dev-secrets, key: notifications-connection-string}
          startupProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
