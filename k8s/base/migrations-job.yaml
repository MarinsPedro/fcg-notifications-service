apiVersion: batch/v1
kind: Job
metadata:
  name: notifications-migrations
  namespace: fcg
  labels:
    app: notifications-migrations
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: notifications-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: fcg-notifications-migrations:latest
          envFrom:
            - secretRef:
                name: notifications-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
