apiVersion: batch/v1
kind: Job
metadata:
  name: notifications-migrations
  namespace: fcg
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: notifications-migrations
          image: fcg-notifications-migrations:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: fcg-notifications-migrations-config}
          env:
            - name: NOTIFICATIONS_MIGRATIONS_CONNECTION
              valueFrom:
                secretKeyRef: {name: fcg-domain-dev-secrets, key: notifications-connection-string}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
