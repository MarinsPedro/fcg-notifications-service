services:
  notifications-db:
    image: postgres:17-alpine
    container_name: fcg-notifications-db
    environment:
      POSTGRES_DB: fcg_notifications
      POSTGRES_USER: fcg_notifications_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DevPass123!}
    ports:
      - "5435:5432"
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_notifications_app -d fcg_notifications"]
      interval: 5s
      timeout: 3s
      retries: 5

  notifications-rabbit:
    image: rabbitmq:3.13-management-alpine
    container_name: fcg-notifications-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications-migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
      secrets:
        - nuget_config
    container_name: fcg-notifications-migrations
    environment:
      ConnectionStrings__Database: "Host=notifications-db;Port=5432;Database=fcg_notifications;Username=fcg_notifications_app;Password=${POSTGRES_PASSWORD:-DevPass123!}"
    depends_on:
      notifications-db:
        condition: service_healthy

  notifications-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      secrets:
        - nuget_config
    container_name: fcg-notifications-api
    environment:
      ConnectionStrings__Database: "Host=notifications-db;Port=5432;Database=fcg_notifications;Username=fcg_notifications_app;Password=${POSTGRES_PASSWORD:-DevPass123!}"
      Authentication__Authority: "http://host.docker.internal:5081"
      Authentication__Audience: "notifications-api"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5087:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      notifications-migrations:
        condition: service_completed_successfully

  notifications-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      secrets:
        - nuget_config
    container_name: fcg-notifications-worker
    environment:
      ConnectionStrings__Database: "Host=notifications-db;Port=5432;Database=fcg_notifications;Username=fcg_notifications_app;Password=${POSTGRES_PASSWORD:-DevPass123!}"
      RabbitMq__Host: "notifications-rabbit"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      notifications-db:
        condition: service_healthy
      notifications-rabbit:
        condition: service_healthy
      notifications-migrations:
        condition: service_completed_successfully

volumes:
  notifications-data:

secrets:
  nuget_config:
    file: ./NuGet.Config
